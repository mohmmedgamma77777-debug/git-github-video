
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الأول</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        .card {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            color: #2563eb;
        }

        p {
            color: #444;
            line-height: 1.8;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>مرحباً بك! 👋</h1>

        <p>
            هذا أول موقع أصممه باستخدام HTML وCSS.
            أتعلم البرمجة وأطور مهاراتي خطوة بخطوة.
        </p>

        <button onclick="showMessage()">
            اضغط هنا
        </button>

        <p id="message"></p>

        <footer>
            صُنع بحب ❤️ | 2026
        </footer>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "رائع! لقد عمل موقعك بنجاح 🎉";
        }
    </script>

</body>
</html>
